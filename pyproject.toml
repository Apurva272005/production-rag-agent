[project]
name = "sgp"
version = "0.1.0"
description = "Production RAG Institute Assistant with LlamaIndex, Inngest, Qdrant, FastEmbed, and OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "inngest>=0.4.0",
    "llama-index-core>=0.10.0",
    "llama-index-readers-file>=0.1.0",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "openai>=1.14.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
]

[tool.uv]
package = false
